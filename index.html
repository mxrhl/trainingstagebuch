<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Training">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3f4f8">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Trainingstag</title>
<style>
:root{--bg:#f3f4f8;--card:#fff;--fg:#0f172a;--muted:#8089a0;--line:#e7e9f0;--acc:#6b7280;--accsoft:#eceef1;--ok:#16a34a;--oksoft:#e3f6ea;--danger:#e11d48;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"],:root:not([data-theme="light"]){color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 -apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif;padding-bottom:110px}
main{max-width:560px;margin:0 auto;padding:16px 16px}
button,input,textarea{font:inherit;color:inherit}
button{border:0;border-radius:14px;padding:12px 16px;background:var(--card);cursor:pointer;font-weight:600}
button:active{transform:scale(.97)}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-bottom:14px}
h1{font-size:34px;line-height:1.05;margin:0;letter-spacing:-.03em;font-weight:800}
.sub{color:var(--muted);font-size:15px;margin:4px 0 0}
.ctl{display:flex;gap:6px}
.ctl button{padding:8px 12px;font-size:15px;box-shadow:0 1px 2px rgba(15,23,42,.06)}
.ctl .chip{background:var(--accsoft);color:var(--acc)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:16px}
.wk button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0 8px;border-radius:16px;background:var(--card);box-shadow:0 1px 2px rgba(15,23,42,.05)}
.wk span{font-size:12px;color:var(--muted);font-weight:600}
.wk b{font-size:17px}
.wk i{width:5px;height:5px;border-radius:50%;background:transparent}
.wk i.dot{background:var(--acc)}
.wk .td b{color:var(--acc)}
.wk .on{background:var(--acc);box-shadow:0 6px 16px rgba(107,114,128,.28)}
.wk .on span,.wk .on b{color:#fff}
.wk .on i.dot{background:#fff}
.card{background:var(--card);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(15,23,42,.04),0 10px 28px rgba(15,23,42,.05)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.hd b{font-size:19px;letter-spacing:-.01em}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin-top:10px}
.bar div{height:100%;background:var(--ok);border-radius:8px;transition:width .25s}
.lab,.row{display:grid;grid-template-columns:24px 1fr 1fr 46px 28px;gap:8px;align-items:center}
.lab{color:var(--muted);font-size:12px;text-align:center;font-weight:600;margin-bottom:2px}
.row{margin:8px 0}
.row .n{color:var(--muted);font-size:14px;text-align:center;font-weight:700}
input,textarea{width:100%;border:2px solid transparent;border-radius:14px;padding:12px 10px;background:var(--bg);font-size:17px;outline:none}
input:focus,textarea:focus{border-color:var(--acc);background:#fff}
.row input{text-align:center;font-weight:700}
.row.ok input{background:var(--oksoft);color:#14532d}
.chk{padding:0;height:46px;font-size:20px;line-height:1;background:var(--bg);color:var(--muted)}
.row.ok .chk{background:var(--ok);color:#fff}
.x{background:none;padding:4px;color:var(--muted);font-size:20px;font-weight:400}
.link{background:none;padding:6px 4px;color:var(--danger);font-size:14px;font-weight:600}
.wide{width:100%;margin-top:6px;background:var(--accsoft);color:var(--acc)}
.p{background:var(--acc);color:#fff;box-shadow:0 6px 16px rgba(107,114,128,.25)}
.add{display:flex;gap:8px}
.add .p{flex:none}
.empty{color:var(--muted);text-align:center;padding:26px 8px}
.item{display:block;width:100%;text-align:left;margin-bottom:10px;padding:14px 16px;border-radius:18px;font-weight:500;box-shadow:0 1px 2px rgba(15,23,42,.05)}
.item b{font-size:17px}
.item small{display:block;color:var(--muted);margin-top:3px;font-size:14px}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;padding:6px;border-radius:26px;background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 8px 30px rgba(15,23,42,.14);width:min(380px,calc(100% - 32px))}
.tabs button{flex:1;background:none;padding:12px 0;border-radius:20px;color:var(--muted)}
.tabs button.on{background:var(--acc);color:#fff}
textarea{min-height:130px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.seg{display:flex;gap:4px;background:var(--bg);border-radius:14px;padding:4px;margin-bottom:12px}.seg button{flex:1;padding:8px 0;font-size:14px;background:none;color:var(--muted)}.seg button.on{background:#fff;color:var(--fg);box-shadow:0 1px 3px rgba(15,23,42,.12)}
.dc{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:var(--oksoft);color:#14532d;border-radius:18px;padding:14px 16px;margin-bottom:14px;font-weight:500}.dc b{font-size:17px;display:block;font-weight:700}.dc small{display:block;font-size:13px;opacity:.75;margin-top:2px}.dc .ck{flex:none;width:30px;height:30px;border-radius:50%;background:var(--ok);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.st{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}.stc{background:var(--card);border-radius:18px;padding:14px 16px;box-shadow:0 1px 2px rgba(15,23,42,.05)}.stc b{display:block;font-size:30px;letter-spacing:-.02em;line-height:1.1}.stc span{color:var(--muted);font-size:13px;font-weight:600}.er{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}.er:first-child{border-top:0}.er b{font-size:16px}.er small{display:block;color:var(--muted);font-size:13px;margin-top:2px}.er .rp{font-size:18px;font-weight:800;text-align:right;line-height:1.25}
.hd .link{margin-left:auto}.cb{flex:none;background:var(--bg);padding:0;width:34px;height:34px;border-radius:12px;color:var(--muted);margin-left:6px;display:flex;align-items:center;justify-content:center}select{flex:1;min-width:0;border-radius:14px;padding:12px 10px;background:var(--bg);font-size:17px;border:2px solid transparent;color:var(--fg)}.nfg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.nfg label{font-size:12px;color:var(--muted);font-weight:600;display:block}.nfg input{margin-top:4px;text-align:center;font-weight:700}.dc.part{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(15,23,42,.05)}.dc.part .ck{background:var(--accsoft);color:var(--acc)}
.msg{color:var(--acc);font-size:14px;margin:10px 0;min-height:20px;font-weight:600}
.note{background:#fff7e6;color:#8a5a00;border-radius:18px;padding:12px 14px;margin-bottom:14px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.note button{background:#ffe3a3;color:#6b4500;padding:8px 12px;font-size:14px;flex:none}
</style>
</head>
<body>
<main id="app"></main>
<nav class="tabs" id="tabs"></nav>
<script>
var KEY='trainingstag-v1', S={days:{}}, cur=today(), tab='heute', msg='', pend=null, pendImp=false;
try{var r=localStorage.getItem(KEY);if(r){var p=JSON.parse(r);if(p&&p.days)S=p;}}catch(e){}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){msg='Speichern nicht möglich. Bitte Backup erstellen.';}}
function pad(n){return n<10?'0'+n:''+n}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return iso(new Date())}
function dt(s){return new Date(s+'T12:00:00')}
function shift(s,n){var d=dt(s);d.setDate(d.getDate()+n);return iso(d)}
function fmt(s){return dt(s).toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short',year:'numeric'})}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function uid(){return Math.random().toString(36).slice(2,9)}
function getDay(){return S.days[cur]||(S.days[cur]={ex:[],note:''})}
function view(){return S.days[cur]||{ex:[],note:''}}
function has(k){return S.days[k]&&S.days[k].ex.length}
function names(){var o={};Object.keys(S.days).forEach(function(k){S.days[k].ex.forEach(function(e){o[e.name]=1})});return Object.keys(o).sort()}
function prevDay(){var k=Object.keys(S.days).filter(function(d){return d<cur&&S.days[d].ex.length}).sort();return k.length?k[k.length-1]:null}
function week(){
  var off=(dt(cur).getDay()+6)%7,mon=shift(cur,-off),h='<div class="wk">';
  for(var i=0;i<7;i++){var k=shift(mon,i),d=dt(k);
    h+='<button class="'+(k===cur?'on ':'')+(k===today()?'td':'')+'" data-a="goto" data-d="'+k+'"><span>'+d.toLocaleDateString('de-DE',{weekday:'short'}).replace('.','')+'</span><b>'+d.getDate()+'</b><i class="'+(has(k)?'dot':'')+'"></i></button>';}
  return h+'</div>';
}
var dw=null,COLL={wo:true,lib:true},WD=null,saveWo=false,WN='',woOk='',WE=null,pendW=null,sortMode=false,EL=null,SEL='',newForm=false,pendL=null,okId=null,NF=mkNF(),CHD='<svg width="16" height="16" viewBox="0 0 16 16"><path d="M3 6l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',CHU='<svg width="16" height="16" viewBox="0 0 16 16"><path d="M3 10l5-5 5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function mkNF(){return{name:'',mode:'kg',side:'both',n:'3',kg:'',reps:'',sec:''}}
function cfgOf(e){var l=e.sets[e.sets.length-1]||{};return{mode:e.mode||'kg',side:e.side||'both',n:e.sets.length||1,kg:l.kg||'',reps:l.reps||'',sec:l.sec||''}}
function fromLib(n){var c=(S.lib&&S.lib[n])||{},sets=[];for(var i=0;i<(c.n||1);i++)sets.push({kg:c.kg||'',reps:c.reps||'',sec:c.sec||'',done:false});return{id:uid(),name:n,mode:c.mode||'kg',side:c.side||'both',sets:sets}}
function ensureLib(){if(S.lib)return;S.lib={};Object.keys(S.days).sort().forEach(function(k){S.days[k].ex.forEach(function(e){S.lib[e.name]=cfgOf(e)})});}
function sortedLib(){return Object.keys(S.lib||{}).sort(function(a,b){return a.localeCompare(b,'de')})}
function addCard(){
  var h='<div class="card"><div class="add"><select id="selEx"><option value="">Übung wählen…</option>'+sortedLib().map(function(n){return'<option value="'+esc(n)+'"'+(SEL===n?' selected':'')+'>'+esc(n)+'</option>'}).join('')+'<option value="__new">+ Neue Übung anlegen…</option></select><button class="p" data-a="addEx">Hinzufügen</button></div>';
  if(newForm){var m=NF.mode==='sec';
    h+='<div style="margin-top:14px"><b style="font-size:16px">Neue Übung</b><input data-nf="name" value="'+esc(NF.name)+'" placeholder="Name der Übung" style="margin:10px 0">'+
    '<div class="seg"><button class="'+(m?'':'on')+'" data-a="nfm" data-m="kg">Gewicht/Wdh.</button><button class="'+(m?'on':'')+'" data-a="nfm" data-m="sec">Zeit in Sek.</button></div>'+
    '<div class="seg"><button class="'+(NF.side==='each'?'':'on')+'" data-a="nfs" data-m="both">Beide Seiten</button><button class="'+(NF.side==='each'?'on':'')+'" data-a="nfs" data-m="each">Pro Seite</button></div>'+
    '<div class="nfg"><label>Sätze<input inputmode="numeric" data-nf="n" value="'+esc(NF.n)+'"></label>'+(m?'<label>Sekunden<input inputmode="numeric" data-nf="sec" value="'+esc(NF.sec)+'"></label>':'<label>kg<input inputmode="decimal" data-nf="kg" value="'+esc(NF.kg)+'"></label><label>Wdh.<input inputmode="numeric" data-nf="reps" value="'+esc(NF.reps)+'"></label>')+'</div>'+
    '<div class="add" style="margin-top:12px"><button class="wide" style="margin:0" data-a="nfx">Abbrechen</button><button class="p" style="flex:1" data-a="nfsave">Anlegen &amp; hinzufügen</button></div></div>';}
  return h+'</div>';
}
function tpls(){return S.tpl||(S.tpl=[])}
function woCard(d){var T=tpls(),h='';
  if(woOk)h+='<div class="msg" style="margin:0 0 12px">Workout „'+esc(woOk)+'“ gespeichert.</div>';
  if(saveWo)h+='<div class="card"><b style="font-size:16px">Workout speichern</b><input data-wn="1" value="'+esc(WN)+'" placeholder="Name, z. B. Beintag" style="margin:10px 0"><div class="add"><button class="wide" style="margin:0" data-a="wocancel">Abbrechen</button><button class="p" style="flex:1" data-a="wosave">Speichern</button></div></div>';
  else if(d.ex.length)h+='<button class="wide" style="margin:0 0 14px;background:var(--card);color:var(--muted)" data-a="woform">Tag als Workout speichern</button>';
  if(T.length)h+='<div class="card"><div class="add"><select id="selWo"><option value="">Workout laden…</option>'+T.map(function(t){return'<option value="'+t.id+'">'+esc(t.name)+'</option>'}).join('')+'</select><button class="p" data-a="woload">Laden</button></div></div>';
  return h;}
function woEditor(){var h='<div style="padding:12px 0;border-top:1px solid var(--line)"><b style="font-size:16px">Workout bearbeiten</b><input data-wd="1" value="'+esc(WD.name)+'" placeholder="Name des Workouts" style="margin:10px 0">';
  WD.ex.forEach(function(x,xi){var m=x.mode==='sec',g='display:grid;grid-template-columns:24px 1fr 1fr 28px;gap:8px;align-items:center;margin:6px 0';
    h+='<div style="border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px"><div class="add"><input data-wx="name" data-xi="'+xi+'" value="'+esc(x.name)+'"><button class="cb" data-a="wdmv" data-m="-1" data-xi="'+xi+'"'+(xi===0?' disabled style="opacity:.3"':'')+'>'+CHU+'</button><button class="cb" data-a="wdmv" data-m="1" data-xi="'+xi+'"'+(xi===WD.ex.length-1?' disabled style="opacity:.3"':'')+'>'+CHD+'</button><button class="cb" data-a="wddelx" data-xi="'+xi+'" style="color:var(--danger)">✕</button></div>'+
    '<div class="seg" style="margin-top:10px"><button class="'+(m?'':'on')+'" data-a="wdm" data-m="kg" data-xi="'+xi+'">Gewicht/Wdh.</button><button class="'+(m?'on':'')+'" data-a="wdm" data-m="sec" data-xi="'+xi+'">Zeit in Sek.</button></div>'+
    '<div class="seg"><button class="'+(x.side==='each'?'':'on')+'" data-a="wds" data-m="both" data-xi="'+xi+'">Beide Seiten</button><button class="'+(x.side==='each'?'on':'')+'" data-a="wds" data-m="each" data-xi="'+xi+'">Pro Seite</button></div>';
    x.sets.forEach(function(s,si){var at=' data-xi="'+xi+'" data-si="'+si+'"';
      h+='<div style="'+g+'"><span style="color:var(--muted);text-align:center;font-weight:700;font-size:14px">'+(si+1)+'</span>'+(m?'<input inputmode="numeric" style="grid-column:span 2;text-align:center;font-weight:700" data-wx="sec"'+at+' value="'+esc(s.sec||'')+'" placeholder="Sek.">':'<input inputmode="decimal" style="text-align:center;font-weight:700" data-wx="kg"'+at+' value="'+esc(s.kg||'')+'" placeholder="kg"><input inputmode="numeric" style="text-align:center;font-weight:700" data-wx="reps"'+at+' value="'+esc(s.reps||'')+'" placeholder="Wdh.">')+'<button class="x" data-a="wdelset"'+at+'>×</button></div>';});
    h+='<button class="wide" data-a="wdaddset" data-xi="'+xi+'">+ Satz</button></div>';});
  h+='<div class="add" style="margin-bottom:10px"><select id="selWd"><option value="">Übung hinzufügen…</option>'+sortedLib().map(function(n){return'<option value="'+esc(n)+'">'+esc(n)+'</option>'}).join('')+'</select><button class="p" data-a="wdadd">Hinzufügen</button></div>';
  if(WD.err)h+='<div class="msg" style="color:var(--danger)">'+esc(WD.err)+'</div>';
  return h+'<div class="add"><button class="wide" style="margin:0" data-a="wdcancel">Abbrechen</button><button class="p" style="flex:1" data-a="wdsave">Speichern</button></div></div>';}
function woListCard(){var T=tpls();if(!T.length)return'';
  return '<div class="card" style="padding:6px 16px"><div class="hd" style="margin:10px 0 2px"><b>Workouts</b><span style="display:flex;align-items:center;gap:8px"><span class="sub" style="margin:0">'+T.length+'</span><button class="cb" style="margin:0" data-a="tgl" data-k="wo" aria-label="Ein- oder ausklappen">'+(COLL.wo?CHD:CHU)+'</button></span></div>'+(COLL.wo?[]:T).map(function(t){
    if(WD&&WD.id===t.id)return woEditor();if(WE&&WE.id===t.id)return'<div style="padding:12px 0;border-top:1px solid var(--line)"><input data-we="1" value="'+esc(WE.name)+'"><div class="add" style="margin-top:10px"><button class="wide" style="margin:0" data-a="worncancel">Abbrechen</button><button class="p" style="flex:1" data-a="wornsave">Speichern</button></div></div>';
    return'<div class="er" style="display:block"><b>'+esc(t.name)+'</b><small>'+t.ex.length+(t.ex.length===1?' Übung':' Übungen')+' · '+esc(t.ex.map(function(x){return x.name}).join(', '))+'</small><div style="display:flex;gap:12px;margin-top:4px"><button class="link" style="color:var(--acc);padding-left:0" data-a="woedit" data-id="'+t.id+'">Bearbeiten</button><button class="link" style="margin-left:0" data-a="wodel" data-id="'+t.id+'">'+(pendW===t.id?'Wirklich entfernen?':'Entfernen')+'</button></div></div>'}).join('')+'</div>';}
function elForm(){var m=EL.mode==='sec';
  return '<div style="padding:12px 0;border-top:1px solid var(--line)"><b style="font-size:16px">Übung bearbeiten</b><input data-el="name" value="'+esc(EL.name)+'" style="margin:10px 0">'+
  '<div class="seg"><button class="'+(m?'':'on')+'" data-a="elm" data-m="kg">Gewicht/Wdh.</button><button class="'+(m?'on':'')+'" data-a="elm" data-m="sec">Zeit in Sek.</button></div>'+
  '<div class="seg"><button class="'+(EL.side==='each'?'':'on')+'" data-a="els" data-m="both">Beide Seiten</button><button class="'+(EL.side==='each'?'on':'')+'" data-a="els" data-m="each">Pro Seite</button></div>'+
  '<div class="nfg"><label>Sätze<input inputmode="numeric" data-el="n" value="'+esc(EL.n)+'"></label>'+(m?'<label>Sekunden<input inputmode="numeric" data-el="sec" value="'+esc(EL.sec)+'"></label>':'<label>kg<input inputmode="decimal" data-el="kg" value="'+esc(EL.kg)+'"></label><label>Wdh.<input inputmode="numeric" data-el="reps" value="'+esc(EL.reps)+'"></label>')+'</div>'+
  (EL.err?'<div class="msg" style="color:var(--danger)">'+esc(EL.err)+'</div>':'')+
  '<div class="add" style="margin-top:12px"><button class="wide" style="margin:0" data-a="elx">Abbrechen</button><button class="p" style="flex:1" data-a="elsave">Speichern</button></div></div>';}
function sortCard(d){return '<div class="card"><div class="hd"><b>Reihenfolge ändern</b><button class="p" style="padding:8px 14px" data-a="sortoff">Fertig</button></div>'+d.ex.map(function(x,i){return'<div class="er"><b>'+esc(x.name)+'</b><span style="display:flex"><button class="cb" data-a="mv" data-m="-1" data-e="'+x.id+'"'+(i===0?' disabled style="opacity:.3"':'')+'>'+CHU+'</button><button class="cb" data-a="mv" data-m="1" data-e="'+x.id+'"'+(i===d.ex.length-1?' disabled style="opacity:.3"':'')+'>'+CHD+'</button></span></div>'}).join('')+'</div>';}
function libCard(){var L=sortedLib();if(!L.length)return'';
  return '<div class="card" style="padding:6px 16px"><div class="hd" style="margin:10px 0 2px"><b>Übungsliste</b><span style="display:flex;align-items:center;gap:8px"><span class="sub" style="margin:0">'+L.length+'</span><button class="cb" style="margin:0" data-a="tgl" data-k="lib" aria-label="Ein- oder ausklappen">'+(COLL.lib?CHD:CHU)+'</button></span></div>'+(COLL.lib?[]:L).map(function(n){if(EL&&EL.orig===n)return elForm();return'<div class="er"><b>'+esc(n)+'</b><span style="display:flex;gap:4px"><button class="link" style="color:var(--acc)" data-a="libedit" data-n="'+esc(n)+'">Bearbeiten</button><button class="link" data-a="libdel" data-n="'+esc(n)+'">'+(pendL===n?'Wirklich entfernen?':'Entfernen')+'</button></span></div>'}).join('')+'</div>';}
ensureLib();
function num(v){var n=parseFloat(String(v==null?'':v).replace(',','.'));return isNaN(n)?0:n}
function nf(n){return n.toLocaleString('de-DE',{maximumFractionDigits:1})}
function dash(){
  var base=dw||today(),mon=shift(base,-((dt(base).getDay()+6)%7)),sun=shift(mon,6),A={},days=0,sets=0,reps=0;
  for(var i=0;i<7;i++){var D=S.days[shift(mon,i)];if(!D)continue;var tr=false;
    D.ex.forEach(function(e){e.sets.forEach(function(s){if(!s.done)return;tr=true;sets++;
      var a=A[e.name]||(A[e.name]={n:e.name,sets:0,reps:0,sec:0,max:0,side:false});a.sets++;if(e.side==='each')a.side=true;
      if(e.mode==='sec'){a.sec+=num(s.sec);}else{var r=num(s.reps),w=num(s.kg);a.reps+=r;reps+=r;if(w>a.max)a.max=w;}});});
    if(tr)days++;}
  var list=Object.keys(A).map(function(k){return A[k]}).sort(function(x,y){return y.sets-x.sets}),
      f=function(s){return dt(s).toLocaleDateString('de-DE',{day:'numeric',month:'short'})},
      thisWk=mon===shift(today(),-((dt(today()).getDay()+6)%7)),h='';
  h+='<div class="top"><div><h1>Woche</h1><p class="sub">'+f(mon)+' – '+f(sun)+(thisWk?' · aktuelle Woche':'')+'</p></div><div class="ctl">'+(thisWk?'':'<button class="chip" data-a="dnow">Aktuell</button>')+'<button data-a="dpw">‹</button><button data-a="dnw">›</button></div></div>';
  h+='<div class="st"><div class="stc"><b>'+days+'</b><span>Trainingstage</span></div><div class="stc"><b>'+list.length+'</b><span>Übungen</span></div><div class="stc"><b>'+sets+'</b><span>Sätze</span></div><div class="stc"><b>'+nf(reps)+'</b><span>Wiederholungen</span></div></div>';
  if(!list.length)return h+'<div class="empty">In dieser Woche wurden noch keine Sätze abgehakt.</div>';
  h+='<div class="card" style="padding:6px 16px">';
  list.forEach(function(a){var r=[];if(a.reps)r.push(nf(a.reps)+' Wdh.');if(a.sec)r.push(nf(a.sec)+' Sek.');
    h+='<div class="er"><div><b>'+esc(a.n)+(a.side?' · pro Seite':'')+'</b><small>'+a.sets+(a.sets===1?' Satz':' Sätze')+(a.max?' · max. '+nf(a.max)+' kg':'')+'</small></div><div class="rp">'+(r.join('<br>')||'–')+'</div></div>';});
  return h+'</div><p class="sub" style="padding:0 6px">Es zählen nur abgehakte Sätze.</p>';
}
function render(){
  var h='';
  if(tab==='heute'){
    var d=view(),pv=prevDay(),done=0,tot=0;
    d.ex.forEach(function(e){e.sets.forEach(function(s){tot++;if(s.done)done++})});
    var due=Object.keys(S.days).length&&(!S.lb||Date.now()-S.lb>7*864e5);
    h+='<div class="top"><div><h1>'+esc(dt(cur).toLocaleDateString('de-DE',{weekday:'long'}))+'</h1><p class="sub">'+esc(dt(cur).toLocaleDateString('de-DE',{day:'numeric',month:'long',year:'numeric'}))+'</p></div>'+
       '<div class="ctl">'+(cur!==today()?'<button class="chip" data-a="now">Heute</button>':'')+'<button data-a="pw">‹</button><button data-a="nw">›</button></div></div>';
    h+=week();
    if(due)h+='<div class="note"><span>Dein letztes Backup ist älter als 7 Tage.</span><button data-a="tab" data-t="daten">Sichern</button></div>';
    if(tot)h+='<div class="card" style="padding:14px 16px"><div class="hd" style="margin:0"><b style="font-size:16px">Fortschritt</b><span class="sub" style="margin:0">'+done+' von '+tot+' Sätzen</span></div><div class="bar"><div style="width:'+Math.round(done/tot*100)+'%"></div></div></div>';
    d.ex.forEach(function(e){
      if(sortMode)return;var all=e.sets.length>0&&e.sets.every(function(s){return s.done});
      if(e.col===true||(e.col!==false&&all)){var dn=e.sets.filter(function(s){return s.done}).length;h+='<button class="dc'+(all?'':' part')+'" data-a="exp" data-m="1" data-e="'+e.id+'"><span><b>'+esc(e.name)+(e.side==='each'?' · pro Seite':'')+'</b><small>'+dn+' von '+e.sets.length+(e.sets.length===1?' Satz':' Sätzen')+' erledigt</small></span><span class="ck">'+(all?'✓':CHD)+'</span></button>';return;}
      h+='<div class="card"><div class="hd"><b>'+esc(e.name)+(e.side==='each'?' <small style="color:var(--muted);font-weight:600;font-size:13px">pro Seite</small>':'')+'</b><button class="link" data-a="delEx" data-e="'+e.id+'">'+(pend===e.id?'Wirklich löschen?':'Löschen')+'</button><button class="cb" data-a="exp" data-m="0" data-e="'+e.id+'" aria-label="Einklappen">'+CHU+'</button></div>';
      h+='<div class="seg"><button class="'+(e.mode==='sec'?'':'on')+'" data-a="mode" data-m="kg" data-e="'+e.id+'">Gewicht/Wdh.</button><button class="'+(e.mode==='sec'?'on':'')+'" data-a="mode" data-m="sec" data-e="'+e.id+'">Zeit in Sek.</button></div>';
      h+='<div class="seg"><button class="'+(e.side==='each'?'':'on')+'" data-a="side" data-m="both" data-e="'+e.id+'">Beide Seiten</button><button class="'+(e.side==='each'?'on':'')+'" data-a="side" data-m="each" data-e="'+e.id+'">Pro Seite</button></div>';
      h+=e.mode==='sec'?'<div class="lab"><span></span><span style="grid-column:span 2">Sekunden</span><span></span><span></span></div>':'<div class="lab"><span></span><span>kg</span><span>Wdh.</span><span></span><span></span></div>';
      e.sets.forEach(function(s,i){
        h+='<div class="row'+(s.done?' ok':'')+'"><span class="n">'+(i+1)+'</span>'+
        (e.mode==='sec'?'<input inputmode="numeric" style="grid-column:span 2" data-k="sec" data-e="'+e.id+'" data-i="'+i+'" value="'+esc(s.sec||'')+'" placeholder="Sek.">':'<input inputmode="decimal" data-k="kg" data-e="'+e.id+'" data-i="'+i+'" value="'+esc(s.kg)+'" placeholder="0">')+
        (e.mode==='sec'?'':'<input inputmode="numeric" data-k="reps" data-e="'+e.id+'" data-i="'+i+'" value="'+esc(s.reps)+'" placeholder="0">')+
        '<button class="chk" data-a="tog" data-e="'+e.id+'" data-i="'+i+'">✓</button>'+
        '<button class="x" data-a="delSet" data-e="'+e.id+'" data-i="'+i+'">×</button></div>';
      });
      h+='<button class="wide" data-a="addSet" data-e="'+e.id+'">+ Satz</button><button class="wide" style="margin-top:8px;background:var(--bg);color:var(--muted)" data-a="std" data-e="'+e.id+'">'+(okId===e.id?'Als Standard gespeichert ✓':'Als Standard speichern')+'</button></div>';
    });
    if(sortMode)h+=sortCard(d);else if(d.ex.length>1)h+='<button class="wide" style="margin:0 0 14px;background:var(--card);color:var(--muted)" data-a="sorton">Reihenfolge ändern</button>';
    if(!d.ex.length){
      h+='<div class="empty">Noch keine Übungen für diesen Tag.</div>';
      if(pv)h+='<button class="p" data-a="copy" style="width:100%;margin-bottom:14px">Plan vom '+esc(fmt(pv))+' übernehmen</button>';
    }
    h+=woCard(d);h+=addCard();var _u=''+
       '<datalist id="exl">'+names().map(function(n){return'<option value="'+esc(n)+'">'}).join('')+'</datalist></div>';
    h+='<div class="card"><textarea data-k="note" placeholder="Notizen zum Training" style="min-height:80px;font-family:inherit;font-size:16px">'+esc(d.note||'')+'</textarea></div>';
  }else if(tab==='woche'){h+=dash();}else if(tab==='verlauf'){
    var ks=Object.keys(S.days).filter(function(k){return S.days[k].ex.length||S.days[k].note}).sort().reverse();
    h+='<div class="top"><div><h1>Verlauf</h1><p class="sub">'+ks.length+' Trainingstage</p></div></div>';
    if(!ks.length)h+='<div class="empty">Sobald du Übungen einträgst, erscheinen sie hier.</div>';
    ks.forEach(function(k){
      var ex=S.days[k].ex,dn=0,tt=0;ex.forEach(function(e){e.sets.forEach(function(s){tt++;if(s.done)dn++})});
      h+='<button class="item" data-a="open" data-d="'+k+'"><b>'+esc(fmt(k))+'</b><small>'+esc(ex.map(function(e){return e.name}).join(', ')||'Nur Notiz')+'</small><small>'+dn+' von '+tt+' Sätzen erledigt</small></button>';
    });
  }else{
    h+='<div class="top"><div><h1>Daten</h1><p class="sub">Alles bleibt auf diesem Gerät.'+(S.lb?' Letztes Backup: '+esc(new Date(S.lb).toLocaleDateString('de-DE')):'')+'</p></div></div>';
    h+=woListCard();h+=libCard();
    h+='<div class="card"><button class="p" data-a="exp" style="width:100%">Backup erstellen</button><div class="msg">'+esc(msg)+'</div>'+
       '<textarea id="bk" placeholder="Hier erscheint dein Backup. Zum Wiederherstellen den Backup-Text einfügen."></textarea>'+
       '<div class="add" style="margin-top:10px"><button class="wide" data-a="cp" style="margin:0">Kopieren</button><button class="wide" data-a="imp" style="margin:0">Wiederherstellen</button></div></div>'+
       '<p class="sub" style="padding:0 6px">Tipp: Kopiere das Backup in die Notizen-App. Dann sind deine Daten auch nach dem Löschen von Safari-Daten sicher.</p>';
  }
  document.getElementById('app').innerHTML=h;
  var t=[['heute','Heute'],['woche','Woche'],['verlauf','Verlauf'],['daten','Daten']];
  document.getElementById('tabs').innerHTML=t.map(function(x){return'<button class="'+(tab===x[0]?'on':'')+'" data-a="tab" data-t="'+x[0]+'">'+x[1]+'</button>'}).join('');
}
function find(id){return getDay().ex.filter(function(e){return e.id===id})[0]}
document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-a]');if(!b)return;
  var a=b.dataset.a,e=b.dataset.e?find(b.dataset.e):null,i=+b.dataset.i,keep=null,wasPend=pend;if(a!=='delEx')pend=null;if(a!=='imp')pendImp=false;if(a!=='libdel')pendL=null;if(a!=='std')okId=null;if(a!=='mv'&&a!=='sorton')sortMode=false;if(a!=='wodel')pendW=null;if(a!=='wosave')woOk='';
  if(a==='tab'){tab=b.dataset.t;msg='';}
  else if(a==='goto')cur=b.dataset.d;
  else if(a==='pw')cur=shift(cur,-7);
  else if(a==='nw')cur=shift(cur,7);
  else if(a==='now')cur=today();
  else if(a==='dpw')dw=shift(dw||today(),-7);
  else if(a==='dnw')dw=shift(dw||today(),7);
  else if(a==='dnow')dw=null;
  else if(a==='open'){cur=b.dataset.d;tab='heute';}
  else if(a==='addEx'){var sv=document.getElementById('selEx').value;if(!sv||sv==='__new')return;getDay().ex.push(fromLib(sv));SEL='';save();}
  else if(a==='delEx'){if(wasPend===b.dataset.e){getDay().ex=getDay().ex.filter(function(x){return x.id!==b.dataset.e});pend=null;save();}else pend=b.dataset.e;}
  else if(a==='exp'&&e){e.col=b.dataset.m!=='1';save();}
  else if(a==='nfm')NF.mode=b.dataset.m;
  else if(a==='nfs')NF.side=b.dataset.m;
  else if(a==='nfx'){newForm=false;NF=mkNF();}
  else if(a==='nfsave'){var nm=NF.name.trim();if(!nm)return;S.lib[nm]={mode:NF.mode,side:NF.side,n:Math.max(1,parseInt(NF.n)||1),kg:NF.kg,reps:NF.reps,sec:NF.sec};getDay().ex.push(fromLib(nm));newForm=false;NF=mkNF();SEL='';save();}
  else if(a==='tgl'){COLL[b.dataset.k]=!COLL[b.dataset.k];}
  else if(a==='woedit'){var et=tpls().filter(function(t){return t.id===b.dataset.id})[0];if(et){WD=JSON.parse(JSON.stringify(et));WD.err='';}}
  else if(a==='wdcancel')WD=null;
  else if(a==='wdm'&&WD)WD.ex[+b.dataset.xi].mode=b.dataset.m;
  else if(a==='wds'&&WD)WD.ex[+b.dataset.xi].side=b.dataset.m;
  else if(a==='wdaddset'&&WD){var xs2=WD.ex[+b.dataset.xi].sets,ls=xs2[xs2.length-1]||{};xs2.push({kg:ls.kg||'',reps:ls.reps||'',sec:ls.sec||''});}
  else if(a==='wdelset'&&WD){var xs3=WD.ex[+b.dataset.xi].sets;if(xs3.length>1)xs3.splice(+b.dataset.si,1);}
  else if(a==='wdmv'&&WD){var wl=WD.ex,wa=+b.dataset.xi,wb=wa+(+b.dataset.m);if(wb>=0&&wb<wl.length){var wt2=wl[wa];wl[wa]=wl[wb];wl[wb]=wt2;}}
  else if(a==='wddelx'&&WD)WD.ex.splice(+b.dataset.xi,1);
  else if(a==='wdadd'&&WD){var wnm=document.getElementById('selWd').value;if(!wnm)return;var wc=S.lib[wnm]||{},wset=[];for(var q=0;q<(wc.n||1);q++)wset.push({kg:wc.kg||'',reps:wc.reps||'',sec:wc.sec||''});WD.ex.push({name:wnm,mode:wc.mode||'kg',side:wc.side||'both',sets:wset});}
  else if(a==='wdsave'&&WD){var nm2=WD.name.trim(),bad=WD.ex.some(function(x){return !x.name.trim()});
    if(!nm2)WD.err='Bitte einen Namen eingeben.';
    else if(!WD.ex.length)WD.err='Mindestens eine Übung wird benötigt.';
    else if(bad)WD.err='Jede Übung braucht einen Namen.';
    else if(tpls().some(function(t){return t.id!==WD.id&&t.name.toLowerCase()===nm2.toLowerCase()}))WD.err='Dieses Workout gibt es schon.';
    else{var tt=tpls().filter(function(t){return t.id===WD.id})[0];if(tt){tt.name=nm2;tt.ex=WD.ex.map(function(x){return{name:x.name.trim(),mode:x.mode,side:x.side,sets:x.sets}});tt.ex.forEach(function(x){if(!S.lib[x.name])S.lib[x.name]=cfgOf(x);});}WD=null;save();}}
  else if(a==='woform'){saveWo=true;WN='';}
  else if(a==='wocancel')saveWo=false;
  else if(a==='wosave'){var wn=WN.trim();if(!wn)return;var wex=getDay().ex.map(function(x){return{name:x.name,mode:x.mode||'kg',side:x.side||'both',sets:x.sets.map(function(s){return{kg:s.kg||'',reps:s.reps||'',sec:s.sec||''}})}}),T=tpls(),wi=T.findIndex(function(t){return t.name.toLowerCase()===wn.toLowerCase()});if(wi>-1){wn=T[wi].name;T[wi].ex=wex;}else T.push({id:uid(),name:wn,ex:wex});saveWo=false;WN='';woOk=wn;save();}
  else if(a==='woload'){var wid=document.getElementById('selWo').value,wt=tpls().filter(function(t){return t.id===wid})[0];if(!wt)return;wt.ex.forEach(function(x){if(!S.lib[x.name])S.lib[x.name]=cfgOf(x);getDay().ex.push({id:uid(),name:x.name,mode:x.mode,side:x.side,sets:x.sets.map(function(s){return{kg:s.kg||'',reps:s.reps||'',sec:s.sec||'',done:false}})});});save();}
  else if(a==='woren'){var rt=tpls().filter(function(t){return t.id===b.dataset.id})[0];if(rt)WE={id:rt.id,name:rt.name};}
  else if(a==='worncancel')WE=null;
  else if(a==='wornsave'&&WE){var rn=WE.name.trim(),rt2=tpls().filter(function(t){return t.id===WE.id})[0];if(rn&&rt2){rt2.name=rn;WE=null;save();}}
  else if(a==='wodel'){var di=b.dataset.id;if(pendW===di){S.tpl=tpls().filter(function(t){return t.id!==di});pendW=null;save();}else pendW=di;}
  else if(a==='sorton')sortMode=true;
  else if(a==='mv'){var xs=getDay().ex,ix=xs.findIndex(function(x){return x.id===b.dataset.e}),jx=ix+(+b.dataset.m);if(ix>-1&&jx>=0&&jx<xs.length){var tp=xs[ix];xs[ix]=xs[jx];xs[jx]=tp;save();}}
  else if(a==='libedit'){var lc=S.lib[b.dataset.n]||{};EL={orig:b.dataset.n,name:b.dataset.n,mode:lc.mode||'kg',side:lc.side||'both',n:String(lc.n||1),kg:lc.kg||'',reps:lc.reps||'',sec:lc.sec||'',err:''};}
  else if(a==='elm'&&EL)EL.mode=b.dataset.m;
  else if(a==='els'&&EL)EL.side=b.dataset.m;
  else if(a==='elx')EL=null;
  else if(a==='elsave'&&EL){var nn=EL.name.trim();
    if(!nn){EL.err='Bitte einen Namen eingeben.';}
    else if(nn!==EL.orig&&S.lib[nn]){EL.err='Diese Übung gibt es schon.';}
    else{var og=EL.orig;if(nn!==og){delete S.lib[og];Object.keys(S.days).forEach(function(k){S.days[k].ex.forEach(function(x){if(x.name===og)x.name=nn})});}
      S.lib[nn]={mode:EL.mode,side:EL.side,n:Math.max(1,parseInt(EL.n)||1),kg:EL.kg,reps:EL.reps,sec:EL.sec};EL=null;save();}}
  else if(a==='std'&&e){S.lib[e.name]=cfgOf(e);okId=e.id;save();}
  else if(a==='libdel'){var ln=b.dataset.n;if(pendL===ln){delete S.lib[ln];pendL=null;save();}else pendL=ln;}
  else if(a==='side'&&e){e.side=b.dataset.m;save();}
  else if(a==='mode'&&e){e.mode=b.dataset.m;save();}
  else if(a==='addSet'&&e){var l=e.sets[e.sets.length-1]||{kg:'',reps:'',sec:''};e.sets.push({kg:l.kg,reps:l.reps,sec:l.sec||'',done:false});save();}
  else if(a==='delSet'&&e){e.sets.splice(i,1);save();}
  else if(a==='tog'&&e){e.sets[i].done=!e.sets[i].done;e.col=undefined;save();}
  else if(a==='copy'){var pv=prevDay();if(pv){getDay().ex=S.days[pv].ex.map(function(x){return{id:uid(),name:x.name,mode:x.mode,side:x.side,sets:x.sets.map(function(s){return{kg:s.kg,reps:s.reps,sec:s.sec||'',done:false}})}});save();}}
  else if(a==='exp'){S.lb=Date.now();save();keep=JSON.stringify(S);msg='Backup erstellt. Jetzt kopieren und sicher ablegen.';}
  else if(a==='cp'){var t=document.getElementById('bk');keep=t.value;t.select();try{navigator.clipboard.writeText(t.value);document.execCommand('copy');}catch(x){}msg='Kopiert.';}
  else if(a==='imp'){try{var o=JSON.parse(document.getElementById('bk').value);if(!o.days)throw 0;if(!pendImp){pendImp=true;keep=document.getElementById('bk').value;msg='Aktuelle Daten werden ersetzt. Tippe erneut auf Wiederherstellen, um zu bestätigen.';}else{S=o;ensureLib();save();pendImp=false;msg='Backup wiederhergestellt.';}}catch(x){msg='Das ist kein gültiges Backup.';}}
  render();
  if(keep!==null&&document.getElementById('bk'))document.getElementById('bk').value=keep;
});
document.addEventListener('input',function(ev){
  var t=ev.target,k=t.dataset.k;if(t.dataset.nf){NF[t.dataset.nf]=t.value;return}if(t.dataset.wn){WN=t.value;return}if(t.dataset.we&&WE){WE.name=t.value;return}if(t.dataset.wd&&WD){WD.name=t.value;return}if(t.dataset.wx&&WD){var wxx=WD.ex[+t.dataset.xi];if(t.dataset.wx==='name')wxx.name=t.value;else wxx.sets[+t.dataset.si][t.dataset.wx]=t.value;return}if(t.dataset.el){EL[t.dataset.el]=t.value;return}if(!k)return;
  if(k==='note'){getDay().note=t.value;save();return}
  var e=find(t.dataset.e);if(e){e.sets[+t.dataset.i][k]=t.value;save();}
});
document.addEventListener('change',function(ev){if(ev.target.id==='selEx'){SEL=ev.target.value;if(SEL==='__new'){newForm=true;SEL='';}render();}});
document.addEventListener('keydown',function(ev){if(ev.key==='Enter'&&ev.target.id==='newEx')document.querySelector('[data-a="addEx"]').click()});
render();
